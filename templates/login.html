<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 绿色低碳智能港口调度系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-leaf"></i>
                <h1 data-i18n="auth.systemName">绿色低碳智能港口调度系统</h1>
                <p data-i18n="auth.loginSubtitle">登录您的账号</p>
            </div>

            <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n="auth.username">用户名</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="auth.password">密码</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember" data-i18n="auth.rememberMe">记住我</label>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="loginBtn">
                    <span data-i18n="auth.login">登录</span>
                    <i class="bi bi-arrow-right ms-2"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p data-i18n="auth.noAccount">还没有账号？</p>
                <a href="{{ url_for('register') }}" data-i18n="auth.registerNow">立即注册</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>登录中...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/';
                } else {
                    showError(data.error || '登录失败');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>登录</span><i class="bi bi-arrow-right ms-2"></i>';
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>登录</span><i class="bi bi-arrow-right ms-2"></i>';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('d-none');
            setTimeout(() => {
                errorMessage.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
