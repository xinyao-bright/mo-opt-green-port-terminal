<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" style="--default-theme: light;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}绿色低碳智能港口调度系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/themes.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navigation.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 导航栏 -->
    <nav class="main-navbar">
        <div class="container-fluid">
            <div class="navbar-brand">
                <i class="bi bi-leaf"></i>
                <span data-i18n="system.name">绿色低碳智能港口调度系统</span>
            </div>

            <div class="navbar-menu" id="navbarMenu">
                <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}" data-i18n="nav.home">首页</a>
                <a href="/port-config" class="nav-item {% if request.path == '/port-config' %}active{% endif %}" data-i18n="nav.portConfig">泊位配置</a>
                <a href="/history" class="nav-item {% if request.path == '/history' %}active{% endif %}" data-i18n="nav.history">历史记录</a>
            </div>

            <div class="navbar-controls">
                <select id="themeSelector" class="control-select">
                    <option value="light" data-i18n="theme.light">明亮模式</option>
                    <option value="dark" data-i18n="theme.dark">暗黑模式</option>
                    <option value="blue" data-i18n="theme.blue">海洋蓝</option>
                </select>

                <select id="langSelector" class="control-select">
                    <option value="zh-CN" data-i18n="language.zh-CN">简体中文</option>
                    <option value="en" data-i18n="language.en">English</option>
                </select>

                <div class="user-info">
                    <i class="bi bi-person-circle"></i>
                    <span>{{ current_user.username }}</span>
                </div>

                <a href="/logout" class="btn-logout" data-i18n="nav.logout">退出</a>
            </div>

            <button class="navbar-toggle" id="navbarToggle">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="main-footer">
        <div class="container-fluid">
            <p>&copy; 2026 绿色低碳智能港口调度系统 |
                <a href="/about" data-i18n="nav.about">关于</a> |
                <a href="/privacy" data-i18n="nav.privacy">隐私政策</a>
            </p>
        </div>
    </footer>

    <!-- 通用脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script>
        // 移动端导航切换
        document.getElementById('navbarToggle')?.addEventListener('click', () => {
            document.getElementById('navbarMenu')?.classList.toggle('active');
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
