{% extends "base.html" %}

{% block title %}历史记录 - 绿色低碳智能港口调度系统{% endblock %}

{% block extra_css %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泊位信息管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #f0f8ff;
            text-shadow: 0 0 8px rgba(100, 180, 255, 0.3);
        }
        .header {
            background: rgba(20, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 180, 255, 0.4);
            padding: 16px 32px;
        }
        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5faff;
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
        }
        .card {
            background: rgba(20, 35, 55, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 180, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .card-header {
            background: rgba(10, 25, 45, 0.8);
            border-bottom: 1px solid rgba(100, 180, 255, 0.3);
            color: #4da6ff;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .btn-back {
            background: linear-gradient(95deg, #3a80c0, #4da6ff);
            border: none;
            border-radius: 25px;
            padding: 10px 24px;
            font-weight: 600;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(100, 180, 255, 0.3);
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #f5faff;
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
        }
        .stat-label {
            font-size: 0.9rem;
            color: #a8c8ff;
        }
        .table {
            color: #e8f0ff;
        }
        .table th {
            color: #4da6ff;
            font-weight: 600;
            text-align: center;
        }
        .table td {
            background: rgba(15, 35, 55, 0.5);
            border-color: rgba(100, 180, 255, 0.2);
            text-align: center;
            vertical-align: middle;
        }
        .table-hover tbody tr:hover td {
            background: rgba(25, 45, 70, 0.7);
        }
        .berth-id {
            font-weight: 700;
            color: #f5faff;
            font-size: 1.1rem;
        }
        .berth-length {
            color: #4da6ff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <header class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="header-title"><i class="bi bi-anchor me-2"></i>泊位信息管理</h1>
                    <p class="text-sm text-muted mt-1">查看所有泊位的基本信息</p>
                </div>
                <button class="btn-back" onclick="goBack()">
                    <i class="bi bi-arrow-left me-2"></i>返回主页面
                </button>
            </div>
        </div>
    </header>

    <main class="container mt-6">
        <!-- 统计卡片 -->
        <div class="row mb-6">
            <div class="col-md-6">
                <div class="card text-center p-4">
                    <div class="stat-value" id="totalBerths">--</div>
                    <div class="stat-label">总泊位数</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-center p-4">
                    <div class="stat-value" id="totalLength">--</div>
                    <div class="stat-label">总长度(米)</div>
                </div>
            </div>
        </div>

        <!-- 泊位列表 -->
        <div class="card">
            <div class="card-header">
                <i class="bi bi-list-ul me-2"></i>泊位详细信息
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>泊位编号</th>
                                <th>泊位长度</th>
                            </tr>
                        </thead>
                        <tbody id="berthsTableBody">
                            <tr><td colspan="2" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadBerths() {
            try {
                const response = await fetch('/api/berths');
                const berths = await response.json();
                
                // 统计数据
                const totalBerths = berths.length;
                const totalLength = berths.reduce((sum, b) => sum + (b.length || 0), 0);
                
                document.getElementById('totalBerths').textContent = totalBerths;
                document.getElementById('totalLength').textContent = totalLength;
                
                // 填充表格
                const tbody = document.getElementById('berthsTableBody');
                tbody.innerHTML = berths.map(berth => `
                    <tr>
                        <td><span class="berth-id">${berth.id}</span></td>
                        <td><span class="berth-length">${berth.length} m</span></td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('加载泊位数据失败:', error);
                document.getElementById('berthsTableBody').innerHTML = 
                    '<tr><td colspan="2" class="text-center text-danger">加载失败</td></tr>';
            }
        }

        function goBack() {
            window.location.href = '/';
        }

        document.addEventListener('DOMContentLoaded', loadBerths);
    </script>
</body>
</html>
